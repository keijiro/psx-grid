[package]
name = "psx-grid-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"
# Rust traversal and synthesis share the 1 ms timer budget in Debug;
# emulator fixtures validate this profile under dense note load.
opt-level = 2
overflow-checks = false

[profile.release]
panic = "abort"
# This is the optimized profile verified on the PSX emulator.
opt-level = 1
codegen-units = 1
