[package]
name = "psx-grid-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"
# Use the same codegen unit count when checking the 1 ms timer deadline.
opt-level = 2
codegen-units = 1
overflow-checks = false

[profile.release]
panic = "abort"
opt-level = 2
codegen-units = 1
