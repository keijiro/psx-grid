[package]
name = "psx-grid-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"
# Voice service must meet the 1 ms dispatch deadline in Debug fixtures.
opt-level = 3

[profile.release]
panic = "abort"
# This is the optimized profile verified on the PSX emulator.
opt-level = 1
codegen-units = 1
